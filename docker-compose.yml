services:
  obsessionapi:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      OBSESSIONAPI_CORS_ORIGINS: ${OBSESSIONAPI_CORS_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
