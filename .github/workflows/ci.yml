name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  fast-unit:
    # 快速层：纯离线协议/单元测试，秒级反馈（参考 our-free-model 的 contributor 模式）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.txt
      - name: Offline protocol and unit tests
        run: python -m pytest tests/test_access_protocols.py tests/test_hardening.py tests/test_request_boundaries.py -q

  full-integration:
    # 完整层：全部回归（含本地 HTTP 上游夹具），约 90 秒
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.txt
      - name: Run full test suite
        run: python -m pytest tests -q
      - name: Check frontend JS syntax
        run: |
          sudo apt-get update && sudo apt-get install -y nodejs
          find static -name '*.js' -print0 | xargs -0 -n1 node --check
